name: Testes da cópia fonte
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
        working-directory: .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node --test src/data/*.test.js src/services/*.test.js

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar dependências da API e do navegador
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci
      - name: Testar login, pedido, reserva, expedição e dashboard no Chromium
        run: python scripts/browser_e2e.py
      - name: Registrar imagem de evidência com dados fictícios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexolog-browser-e2e
          path: artifacts/e2e/*.png
          if-no-files-found: ignore
          retention-days: 7
